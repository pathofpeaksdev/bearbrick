const descriptions = {
  bb: 'Коллекционная фигурка BE@RBRICK 400% для интерьера, подарка или личной коллекции.',
  kaws: 'Коллекционная фигурка KAWS с узнаваемым дизайном для интерьера, подарка или коллекции.'
};
let currentTab = 'bb';
let selected = new Map();

function money(price) {
  return price && price > 0 ? price.toLocaleString('ru') + ' ₸' : 'Уточнить цену';
}
function getItems() { return currentTab === 'bb' ? bbItems : kawsItems; }
function itemId(item) { return item.url; }
function makeDesc(item, type) {
  const base = type === 'bb' ? descriptions.bb : descriptions.kaws;
  return `${base} Размер: ${item.size || 'уточнить'}.`;
}
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-bb').classList.toggle('active', tab === 'bb');
  document.getElementById('tab-kaws').classList.toggle('active', tab === 'kaws');
  render();
}
function render() {
  const items = getItems();
  const type = currentTab;
  document.getElementById('count').textContent = items.length + ' товаров в разделе ' + (type === 'bb' ? 'BE@RBRICK' : 'KAWS');
  document.getElementById('grid').innerHTML = items.map((item, index) => {
    const id = itemId(item);
    const isSelected = selected.has(id);
    const badgeClass = item.big ? 'xl' : type;
    const badgeText = item.big ? 'XL' : (type === 'bb' ? '400%' : 'KAWS');
    return `
      <article class="card">
        <div class="imgbox">
          <div class="badge ${badgeClass}">${badgeText}</div>
          <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.style.opacity='0.25'">
          <div class="size">${item.size || ''}</div>
        </div>
        <div class="body">
          <div class="name">${item.name}</div>
          <div class="desc">${makeDesc(item, type)}</div>
          <div class="price">${money(item.price).replace(' ₸','')} <span>${item.price && item.price > 0 ? '₸' : ''}</span></div>
          <div class="buttons">
            <a class="kaspi" href="${item.url}" target="_blank" rel="noopener">Открыть Kaspi</a>
            <button class="select ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${encodeURIComponent(id)}')">${isSelected ? 'Выбрано ✓' : 'Выбрать'}</button>
          </div>
        </div>
      </article>`;
  }).join('');
  updateBottom();
}
function toggleSelect(encodedId) {
  const id = decodeURIComponent(encodedId);
  const all = [...bbItems.map(i => ({...i, type:'BE@RBRICK'})), ...kawsItems.map(i => ({...i, type:'KAWS'}))];
  const item = all.find(i => i.url === id);
  if (!item) return;
  if (selected.has(id)) selected.delete(id);
  else selected.set(id, item);
  render();
}
function updateBottom() {
  const count = selected.size;
  document.getElementById('selected-count').textContent = 'Выбрано: ' + count;
  document.getElementById('send-btn').disabled = count === 0;
}
function clearSelected() { selected.clear(); render(); }
function sendWhatsApp() {
  if (!selected.size) return;
  const lines = [];
  lines.push('Здравствуйте! Хочу заказать эти фигурки:');
  lines.push('');
  let n = 1;
  selected.forEach(item => {
    lines.push(`${n}. ${item.type} — ${item.name}`);
    lines.push(`Цена: ${money(item.price)}`);
    lines.push(`Ссылка: ${item.url}`);
    lines.push('');
    n++;
  });
  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
  window.open(url, '_blank');
}
render();
